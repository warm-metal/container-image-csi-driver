name: Create and publish the container image

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'

env:
  BASE_REPOSITORY: warm-metal/container-image-csi-driver
  BASE_DEFAULT_BRANCH: main
  BASE_IMAGE_NAME: ${{ (startsWith(github.ref, 'refs/tags/v1.') || github.ref == 'refs/heads/release-v1.2.x') && 'warmmetal/csi-image' || 'warmmetal/container-image-csi-driver' }}

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture — no QEMU emulation.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute a filesystem/artifact-safe platform pair (linux/amd64 -> linux-amd64)
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Fork PRs: push=false -> build only, nothing to push (no registry
          # credentials available). Same-repo pushes/PRs: push=true -> push an
          # untagged, digest-addressed image; the merge job below stitches the
          # per-arch digests into one tagged multi-arch manifest.
          outputs: type=image,name=${{ env.BASE_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    # Only for same-repo events: pushes, tags, and PRs opened from within the base
    # repo. Fork PRs stop after the build job above — there is nothing to merge or
    # push, and no registry credentials are available to fork PR runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BASE_IMAGE_NAME }}
          tags: |
            # set 'latest' tag for default branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', env.BASE_DEFAULT_BRANCH) }}
            # set image tag based on GitHub release tag
            type=semver,pattern={{version}},prefix=v
            # set the image tag based on the branch (non-default branches only)
            type=ref,event=branch,enable=${{ github.ref_name != env.BASE_DEFAULT_BRANCH }}
            # set image tag for PRs: pr-<number>
            type=ref,event=pr
          flavor: |
            latest=false

      - name: Create multi-arch manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # intentional word-splitting: each "-t <tag>"
          # and each "<image>@sha256:<digest>" must expand into a separate argument.
          docker buildx imagetools create \
            $(echo '${{ steps.meta.outputs.json }}' | jq -cr '.tags | map("-t " + .) | join(" ")') \
            $(printf '${{ env.BASE_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect pushed image
        run: |
          docker buildx imagetools inspect ${{ env.BASE_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  backport-release:
    runs-on: ubuntu-latest
    # Only run when a v2.x tag is pushed to the base repo
    if: >-
      github.repository == 'warm-metal/container-image-csi-driver' &&
      startsWith(github.ref, 'refs/tags/v2.')
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Compute backport version and commit range
        id: versions
        run: |
          V2_TAG="${GITHUB_REF_NAME}"
          echo "v2_tag=${V2_TAG}" >> "$GITHUB_OUTPUT"

          # Find the previous v2.x tag to define the cherry-pick range
          PREV_V2_TAG=$(git tag --sort=-v:refname | grep -E '^v2\.' | grep -v "^${V2_TAG}$" | head -1)
          if [ -z "$PREV_V2_TAG" ]; then
            echo "No previous v2.x tag found — cannot determine commit range."
            exit 1
          fi
          echo "prev_v2_tag=${PREV_V2_TAG}" >> "$GITHUB_OUTPUT"
          echo "Commit range: ${PREV_V2_TAG}..${V2_TAG}"

          # Determine the latest v1.2.x tag to compute next patch version
          LATEST_V1_TAG=$(git tag --sort=-v:refname | grep -E '^v1\.2\.' | head -1)
          if [ -z "$LATEST_V1_TAG" ]; then
            echo "No existing v1.2.x tag found — cannot compute next version."
            exit 1
          fi
          PATCH=$(echo "$LATEST_V1_TAG" | sed 's/v1\.2\.//')
          NEXT_PATCH=$((PATCH + 1))
          NEW_V1_TAG="v1.2.${NEXT_PATCH}"
          echo "new_v1_tag=${NEW_V1_TAG}" >> "$GITHUB_OUTPUT"

          echo "New backport tag: ${NEW_V1_TAG}"

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create or reset release-v1.2.x branch from upstream tip
        run: |
          # Fetch the upstream release-v1.2.x branch (this is the base repo, so origin IS upstream)
          git fetch origin release-v1.2.x
          git checkout -B release-v1.2.x origin/release-v1.2.x

      - name: Squash cherry-pick commits from v2.x release range
        id: cherrypick
        run: |
          PREV_V2_TAG="${{ steps.versions.outputs.prev_v2_tag }}"
          V2_TAG="${{ steps.versions.outputs.v2_tag }}"
          NEW_V1_TAG="${{ steps.versions.outputs.new_v1_tag }}"

          # Collect commits introduced between prev v2 tag and new v2 tag, oldest-first
          COMMITS=$(git log --reverse --format="%H" "${PREV_V2_TAG}..${V2_TAG}")
          if [ -z "$COMMITS" ]; then
            echo "No commits found in range ${PREV_V2_TAG}..${V2_TAG}. Nothing to backport."
            exit 1
          fi

          echo "Commits to cherry-pick:"
          echo "$COMMITS"

          # Files where release-v1.2.x is KNOWN to intentionally diverge from main
          # (v2.x): the image name env var and the --latest flag in this same
          # workflow file, the version strings in Makefile/Chart.yaml, and the
          # Go module files (release-v1.2.x intentionally pins older dependency
          # versions than main). If a cherry-pick conflicts ONLY within these
          # files, we resolve it by taking the incoming (v2.x) side — the
          # deterministic fixups further below then overwrite the version
          # strings and workflow values with the correct v1.2.x-specific ones
          # unconditionally, and go.mod/go.sum are re-tidied, so the temporary
          # "wrong" resolution never survives as-is.
          #
          # NOTE: for go.mod/go.sum specifically, resolving in favour of main
          # means release-v1.2.x's older pinned dependency versions are bumped
          # to whatever main currently has, every time a dependency-bump commit
          # is in the backport range. This is an intentional, accepted trade-off
          # to keep the backport job unattended for routine Dependabot bumps —
          # NOT a claim that the two branches no longer diverge on purpose.
          #
          # Any conflict touching a file NOT in this list is NOT auto-resolved.
          # We abort without pushing or committing anything and report exactly
          # which commit and files need a human to manually cherry-pick and
          # resolve. Silently guessing here is how v1.2.16 shipped under the
          # wrong Docker Hub image name — a real conflict on a divergent line
          # (BASE_IMAGE_NAME, at the time not yet in this safe list) was
          # auto-resolved in favour of main's value with no fixup and no
          # failure to catch it.
          SAFE_CONFLICT_FILES=(
            "Makefile"
            "charts/warm-metal-csi-driver/Chart.yaml"
            ".github/workflows/images-build-and-push.yaml"
            "go.mod"
            "go.sum"
          )

          is_safe_conflict_file() {
            local f="$1"
            for safe in "${SAFE_CONFLICT_FILES[@]}"; do
              [ "$f" = "$safe" ] && return 0
            done
            return 1
          }

          for SHA in $COMMITS; do
            SUBJECT=$(git log -1 --format="%s" "$SHA")
            echo "--- Cherry-picking ${SHA} (${SUBJECT}) ---"

            if git cherry-pick "$SHA" > /tmp/cherry-pick-output.log 2>&1; then
              cat /tmp/cherry-pick-output.log
              continue
            fi

            cat /tmp/cherry-pick-output.log
            UNMERGED=$(git diff --name-only --diff-filter=U)

            if [ -z "$UNMERGED" ]; then
              # No conflict markers were left behind, so this wasn't a content
              # conflict at all — the commit's change is already present on
              # release-v1.2.x (e.g. hand-applied during a prior manual backport,
              # as happened for a781471 before v2.1.13). Safe to skip as a no-op.
              if grep -qi "The previous cherry-pick is now empty" /tmp/cherry-pick-output.log; then
                echo "Commit ${SHA} introduces no change vs. release-v1.2.x tip (already applied). Skipping as a no-op."
                git cherry-pick --skip
                continue
              fi

              echo "::error::Backport failed on commit ${SHA} (${SUBJECT}) for an unrecognized reason — no merge conflict was reported, but the cherry-pick did not succeed. Aborting without making any changes; this needs manual investigation."
              git cherry-pick --abort
              exit 1
            fi

            UNSAFE_FILES=""
            for f in $UNMERGED; do
              if ! is_safe_conflict_file "$f"; then
                UNSAFE_FILES="${UNSAFE_FILES}${f}, "
              fi
            done

            if [ -n "$UNSAFE_FILES" ]; then
              UNSAFE_FILES="${UNSAFE_FILES%, }"
              echo "::error::Backport cherry-pick hit a merge conflict this job cannot safely auto-resolve."
              echo "::error::Commit ${SHA} (${SUBJECT}) conflicts in: ${UNSAFE_FILES}"
              echo "This job only auto-resolves known branch-specific divergences in: ${SAFE_CONFLICT_FILES[*]}"
              echo "No changes have been made to release-v1.2.x — nothing was committed or pushed."
              echo "Resolve this manually:"
              echo "  git fetch origin release-v1.2.x && git checkout -B release-v1.2.x origin/release-v1.2.x"
              echo "  git cherry-pick ${SHA}"
              echo "  # resolve conflicts in: ${UNSAFE_FILES}"
              git cherry-pick --abort
              exit 1
            fi

            echo "Conflict confined to known-divergent file(s) [${UNMERGED}] — resolving in favour of the incoming (v2.x) change; the deterministic fixups below restore the v1.2.x-specific values."
            for f in $UNMERGED; do
              git checkout --theirs -- "$f"
              git add "$f"
            done
            git cherry-pick --continue --no-edit
          done

          # Fix version strings unconditionally — these always conflict between v2.x and v1.2.x
          # Strip leading 'v' for Chart.yaml version field
          CHART_VERSION="${NEW_V1_TAG#v}"

          sed -i "s/^VERSION ?= .*/VERSION ?= ${NEW_V1_TAG}/" Makefile
          sed -i "s/^version: .*/version: ${CHART_VERSION}/" charts/warm-metal-csi-driver/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: ${NEW_V1_TAG}/" charts/warm-metal-csi-driver/Chart.yaml

          # Fix workflow-level branch-specific divergences unconditionally. These lines
          # often conflict because v2.x and v1.2.x intentionally differ.
          BASE_IMAGE_NAME_COND="${{ (startsWith(github.ref, 'refs/tags/v1.') || github.ref == 'refs/heads/release-v1.2.x') && 'warmmetal/csi-image' || 'warmmetal/container-image-csi-driver' }}"
          sed -i "s|^  BASE_IMAGE_NAME:.*|  BASE_IMAGE_NAME: ${BASE_IMAGE_NAME_COND}|" .github/workflows/images-build-and-push.yaml

          # Ensure the backported release is never promoted to GitHub's "Latest".
          # If the line already ends with --latest=false, leave it unchanged.
          if ! grep -q '^            --latest=false$' .github/workflows/images-build-and-push.yaml; then
            sed -i '/^            --target release-v1\.2\.x$/a\\            --latest=false' .github/workflows/images-build-and-push.yaml
          fi

          # If any commit touched go.mod/go.sum, a conflict there was resolved in
          # favour of main's (newer) dependency versions above. Re-tidy so the
          # module graph is internally consistent rather than a raw, possibly
          # mismatched merge of two module files. Safe to run unconditionally —
          # a no-op when go.mod/go.sum weren't touched.
          go mod tidy
          git add go.mod go.sum

          git add Makefile charts/warm-metal-csi-driver/Chart.yaml .github/workflows/images-build-and-push.yaml

          # Amend the last cherry-pick commit to include the version fixups,
          # then soft-reset all cherry-picked commits into one squash commit
          SQUASH_BASE=$(git rev-parse origin/release-v1.2.x)
          COMMIT_MSG=$(git log --format="%s" "${PREV_V2_TAG}..${V2_TAG}" | head -1)
          git reset --soft "$SQUASH_BASE"
          FULL_MSG="${COMMIT_MSG}"$'\n\n'"Backported from ${V2_TAG} (commits: ${PREV_V2_TAG}..${V2_TAG})"$'\n'"Version bumped to ${NEW_V1_TAG}."
          git commit -m "${FULL_MSG}"

      - name: Push release-v1.2.x branch
        run: |
          git push origin release-v1.2.x --force-with-lease

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          NEW_V1_TAG="${{ steps.versions.outputs.new_v1_tag }}"
          V2_TAG="${{ steps.versions.outputs.v2_tag }}"
          PREV_V2_TAG="${{ steps.versions.outputs.prev_v2_tag }}"

          # Create the tag on the current HEAD (tip of release-v1.2.x)
          git tag "$NEW_V1_TAG"
          git push origin "$NEW_V1_TAG"

          # Collect commit subjects for release notes
          NOTES=$(git log --format="- %s" "${PREV_V2_TAG}..${V2_TAG}")

          RELEASE_NOTES="Backported from ${V2_TAG}."$'\n\n'"## Changes"$'\n'"${NOTES}"
          gh release create "$NEW_V1_TAG" \
            --title "${NEW_V1_TAG}" \
            --notes "${RELEASE_NOTES}" \
            --target release-v1.2.x \
            --latest=false
