version: 2

# All version-update PRs (Go modules, Docker base images, GitHub Actions)
# are consolidated into a single daily pull request via the "all-deps"
# multi-ecosystem group below. Note: multi-ecosystem grouping does not
# prevent Dependabot from closing and replacing this PR with a new one
# if the set of updatable dependencies changes between scheduled runs
# (see https://github.com/dependabot/dependabot-core/issues/10019) —
# that behavior is not configurable via dependabot.yml.
multi-ecosystem-groups:
  all-deps:
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    pull-request-branch-name:
      separator: "/"

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-deps"

  # Go modules — covers all *maintained* go.mod files in the repo.
  # /test/e2e is intentionally excluded: its go.mod requires
  # k8s.io/kubernetes@v1.20.5, which pulls in k8s.io/legacy-cloud-providers
  # at an unresolvable pseudo-version. Dependabot cannot resolve this
  # module (dependency_file_not_resolvable) and the resulting error
  # currently crashes dependabot-core's PR message builder outright
  # ("Error while generating commit message: Cannot detect VCS"),
  # which appears to have blocked the whole multi-ecosystem group PR
  # from being created for ANY ecosystem, not just gomod. See the
  # module's own comment: it needs a full rewrite onto
  # sigs.k8s.io/e2e-framework before it can be scanned safely.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/test/sanity"
    patterns:
      - "*"
    allow:
      - dependency-type: "all"
    multi-ecosystem-group: "all-deps"

  # Dockerfiles & Helm chart image tags — covers every Dockerfile in the
  # repo plus the Helm chart's values*.yaml image tag pins (Dependabot's
  # docker ecosystem also updates image references in Helm "values"
  # files, not just Dockerfiles).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/test/node-server"
      - "/test/sanity"
      - "/test/e2e"
      - "/test/unit"
      - "/hack/integration-test-image"
      - "/hack/integration-test-image/kind-node-image"
      - "/charts/warm-metal-csi-driver"
    patterns:
      - "*"
    multi-ecosystem-group: "all-deps"
