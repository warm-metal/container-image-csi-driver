version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore: [skip ci]"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      dependencies:
        patterns:
          - "*"
    rebase-strategy: "auto"
    pull-request:
      header: "⚙️ GitHub Actions"

  # Go modules — single grouped PR per directory
  # Covers all go.mod files in the repo (root module + test-only modules).
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/test/sanity"
      - "/test/e2e"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "all"
    rebase-strategy: "auto"
    pull-request:
      header: "📦 Go Dependencies"

  # Dockerfiles & Helm chart image tags — single grouped PR per directory
  # Covers every Dockerfile in the repo plus the Helm chart's values*.yaml
  # image tag pins (Dependabot's docker ecosystem also updates image
  # references in Helm "values" files, not just Dockerfiles).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/test/node-server"
      - "/test/sanity"
      - "/test/e2e"
      - "/test/unit"
      - "/hack/integration-test-image"
      - "/hack/integration-test-image/kind-node-image"
      - "/charts/warm-metal-csi-driver"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      dependencies:
        patterns:
          - "*"
    rebase-strategy: "auto"
    pull-request:
      header: "🐳 Docker Base Images"
